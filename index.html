<html lang="zh-CN">

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>老人与海 · 命运之海</title>
    <style>
        /* ========== Reset ========== */
        * { margin: 0; padding: 0; -webkit-box-sizing: border-box; -moz-box-sizing: border-box; box-sizing: border-box; }

        /* ========== Base ========== */
        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "WenQuanYi Micro Hei", sans-serif;
            background: #060e14;
            color: #e8dcc8;
            min-height: 100vh;
            display: -webkit-box;
            display: -moz-box;
            display: -ms-flexbox;
            display: -webkit-flex;
            display: flex;
            -webkit-box-pack: center;
            -moz-box-pack: center;
            -ms-flex-pack: center;
            -webkit-justify-content: center;
            justify-content: center;
            -webkit-box-align: center;
            -moz-box-align: center;
            -ms-flex-align: center;
            -webkit-align-items: center;
            align-items: center;
            padding: 24px;
            overflow-x: hidden;
        }

        /* Deep ocean background with liquid light spots */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 20%, rgba(30,100,140,0.25) 0%, transparent 60%),
                radial-gradient(ellipse 60% 80% at 80% 70%, rgba(20,80,110,0.2) 0%, transparent 60%),
                radial-gradient(ellipse 50% 50% at 50% 50%, rgba(40,120,160,0.12) 0%, transparent 70%),
                -webkit-linear-gradient(180deg, #060e14 0%, #0a1a24 30%, #0d1f2c 60%, #09151c 100%);
            background:
                radial-gradient(ellipse 80% 60% at 20% 20%, rgba(30,100,140,0.25) 0%, transparent 60%),
                radial-gradient(ellipse 60% 80% at 80% 70%, rgba(20,80,110,0.2) 0%, transparent 60%),
                radial-gradient(ellipse 50% 50% at 50% 50%, rgba(40,120,160,0.12) 0%, transparent 70%),
                -moz-linear-gradient(180deg, #060e14 0%, #0a1a24 30%, #0d1f2c 60%, #09151c 100%);
            background:
                radial-gradient(ellipse 80% 60% at 20% 20%, rgba(30,100,140,0.25) 0%, transparent 60%),
                radial-gradient(ellipse 60% 80% at 80% 70%, rgba(20,80,110,0.2) 0%, transparent 60%),
                radial-gradient(ellipse 50% 50% at 50% 50%, rgba(40,120,160,0.12) 0%, transparent 70%),
                linear-gradient(180deg, #060e14 0%, #0a1a24 30%, #0d1f2c 60%, #09151c 100%);
        }
        /* Subtle liquid wave overlay */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 200%; height: 100%;
            z-index: 0;
            opacity: 0.03;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 60px,
                rgba(180,220,255,0.5) 60px,
                rgba(180,220,255,0.5) 62px
            );
            -webkit-animation: liquidDrift 25s linear infinite;
            -moz-animation: liquidDrift 25s linear infinite;
            animation: liquidDrift 25s linear infinite;
        }
        @-webkit-keyframes liquidDrift {
            from { -webkit-transform: translateX(0) translateY(0); transform: translateX(0) translateY(0); }
            to { -webkit-transform: translateX(-50%) translateY(-20px); transform: translateX(-50%) translateY(-20px); }
        }
        @-moz-keyframes liquidDrift {
            from { -moz-transform: translateX(0) translateY(0); transform: translateX(0) translateY(0); }
            to { -moz-transform: translateX(-50%) translateY(-20px); transform: translateX(-50%) translateY(-20px); }
        }
        @keyframes liquidDrift {
            from { -webkit-transform: translateX(0) translateY(0); -moz-transform: translateX(0) translateY(0); transform: translateX(0) translateY(0); }
            to { -webkit-transform: translateX(-50%) translateY(-20px); -moz-transform: translateX(-50%) translateY(-20px); transform: translateX(-50%) translateY(-20px); }
        }

        /* ========== Liquid Glass WebGL Canvas ========== */
        #liquid-glass-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.55;
            display: none;
        }
        #liquid-glass-bg.active {
            display: block;
        }

        /* ========== App Container — 液态毛玻璃 ========== */
        #app {
            position: relative;
            z-index: 1;
            max-width: 860px;
            width: 100%;
            /* 毛玻璃核心 */
            background: rgba(15, 45, 60, 0.55);
            -webkit-backdrop-filter: blur(16px) saturate(140%);
            backdrop-filter: blur(16px) saturate(140%);
            /* 大圆角 */
            border-radius: 28px;
            padding: 32px 34px;
            /* 多层阴影模拟液态深度 */
            -webkit-box-shadow:
                0 8px 32px rgba(0,0,0,0.5),
                0 2px 8px rgba(0,0,0,0.3),
                inset 0 1px 0 rgba(255,255,255,0.08),
                inset 0 -1px 0 rgba(0,0,0,0.15);
            -moz-box-shadow:
                0 8px 32px rgba(0,0,0,0.5),
                0 2px 8px rgba(0,0,0,0.3),
                inset 0 1px 0 rgba(255,255,255,0.08),
                inset 0 -1px 0 rgba(0,0,0,0.15);
            box-shadow:
                0 8px 32px rgba(0,0,0,0.5),
                0 2px 8px rgba(0,0,0,0.3),
                inset 0 1px 0 rgba(255,255,255,0.08),
                inset 0 -1px 0 rgba(0,0,0,0.15);
            /* 玻璃边框 */
            border: 1px solid rgba(255,255,255,0.1);
            /* 顶部高光线 */
            position: relative;
            overflow: hidden;
        }
        /* 顶部液态高光 */
        #app::before {
            content: '';
            position: absolute;
            top: 0; left: 20px; right: 20px;
            height: 1px;
            background: -webkit-linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            background: -moz-linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            z-index: 2;
            pointer-events: none;
        }

        /* ========== Header ========== */
        #header {
            display: -webkit-box;
            display: -moz-box;
            display: -ms-flexbox;
            display: -webkit-flex;
            display: flex;
            -webkit-box-pack: justify;
            -moz-box-pack: justify;
            -ms-flex-pack: justify;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            -webkit-box-align: center;
            -moz-box-align: center;
            -ms-flex-align: center;
            -webkit-align-items: center;
            align-items: center;
            padding-bottom: 14px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(201,168,108,0.25);
            position: relative;
        }
        #header::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 0; width: 60px; height: 2px;
            background: -webkit-linear-gradient(90deg, #c9a86c, transparent);
            background: -moz-linear-gradient(90deg, #c9a86c, transparent);
            background: linear-gradient(90deg, #c9a86c, transparent);
            border-radius: 1px;
        }
        #header h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 4px;
            color: #d4b87a;
            text-shadow: 0 0 20px rgba(201,168,108,0.2);
            cursor: pointer;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-transition: text-shadow 0.3s;
            transition: text-shadow 0.3s;
        }
        #header h1:hover {
            text-shadow: 0 0 28px rgba(201,168,108,0.6);
        }
        #save-indicator {
            font-size: 13px;
            color: rgba(180,210,220,0.8);
            cursor: pointer;
            background: rgba(255,255,255,0.06);
            padding: 8px 18px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            -webkit-transition: all 0.3s;
            -moz-transition: all 0.3s;
            transition: all 0.3s;
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
        }
        #save-indicator:hover {
            background: rgba(255,255,255,0.12);
            border-color: rgba(201,168,108,0.4);
            -webkit-box-shadow: 0 0 16px rgba(201,168,108,0.15);
            -moz-box-shadow: 0 0 16px rgba(201,168,108,0.15);
            box-shadow: 0 0 16px rgba(201,168,108,0.15);
        }

        /* ========== Stats Bar — 玻璃卡片 ========== */
        #stats {
            display: -webkit-box;
            display: -moz-box;
            display: -ms-flexbox;
            display: -webkit-flex;
            display: flex;
            -webkit-flex-wrap: wrap;
            -ms-flex-wrap: wrap;
            flex-wrap: wrap;
            gap: 12px 20px;
            background: rgba(255,255,255,0.04);
            padding: 14px 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
        }
        .stat-item {
            display: -webkit-box;
            display: -moz-box;
            display: -ms-flexbox;
            display: -webkit-flex;
            display: flex;
            -webkit-box-align: center;
            -moz-box-align: center;
            -ms-flex-align: center;
            -webkit-align-items: center;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .stat-label { color: rgba(180,210,220,0.7); font-size: 13px; }
        .stat-bar {
            width: 90px;
            height: 6px;
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            overflow: hidden;
            -webkit-box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
            -moz-box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
        }
        .stat-fill {
            height: 100%;
            border-radius: 10px;
            -webkit-transition: width 0.6s ease;
            -moz-transition: width 0.6s ease;
            transition: width 0.6s ease;
            -webkit-box-shadow: 0 0 8px currentColor;
            -moz-box-shadow: 0 0 8px currentColor;
            box-shadow: 0 0 8px currentColor;
        }
        .stat-fill.will { background: -webkit-linear-gradient(left, #c9a86c, #f0d6a8); background: -moz-linear-gradient(left, #c9a86c, #f0d6a8); background: linear-gradient(to right, #c9a86c, #f0d6a8); color: #c9a86c; }
        .stat-fill.sta  { background: -webkit-linear-gradient(left, #5b9aa0, #8ad4dc); background: -moz-linear-gradient(left, #5b9aa0, #8ad4dc); background: linear-gradient(to right, #5b9aa0, #8ad4dc); color: #5b9aa0; }
        .stat-fill.ins  { background: -webkit-linear-gradient(left, #9b6b9b, #d4aad4); background: -moz-linear-gradient(left, #9b6b9b, #d4aad4); background: linear-gradient(to right, #9b6b9b, #d4aad4); color: #9b6b9b; }
        .stat-val { color: #e8dcc8; font-weight: bold; min-width: 18px; font-size: 15px; }

        /* ========== Scene & Story ========== */
        #scene-title {
            font-size: 15px;
            color: #c9a86c;
            margin-bottom: 6px;
            padding: 6px 0 6px 16px;
            font-weight: 600;
            border-left: 3px solid rgba(201,168,108,0.5);
            border-radius: 0 4px 4px 0;
        }
        #chapter-indicator {
            font-size: 12px;
            color: rgba(180,210,220,0.5);
            margin-bottom: 16px;
            letter-spacing: 3px;
        }
        #story-text {
            background: rgba(255,255,255,0.03);
            padding: 24px 26px;
            border-radius: 20px;
            line-height: 2;
            font-size: 16px;
            min-height: 100px;
            border: 1px solid rgba(255,255,255,0.05);
            border-left: 3px solid rgba(58,106,122,0.5);
            margin-bottom: 22px;
            white-space: pre-wrap;
            word-break: break-word;
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
            -webkit-animation: fadeIn 0.4s ease;
            -moz-animation: fadeIn 0.4s ease;
            animation: fadeIn 0.4s ease;
        }
        @-webkit-keyframes fadeIn {
            from { opacity: 0; -webkit-transform: translateY(10px); transform: translateY(10px); }
            to { opacity: 1; -webkit-transform: translateY(0); transform: translateY(0); }
        }
        @-moz-keyframes fadeIn {
            from { opacity: 0; -moz-transform: translateY(10px); transform: translateY(10px); }
            to { opacity: 1; -moz-transform: translateY(0); transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; -webkit-transform: translateY(10px); -moz-transform: translateY(10px); transform: translateY(10px); }
            to { opacity: 1; -webkit-transform: translateY(0); -moz-transform: translateY(0); transform: translateY(0); }
        }

        /* ========== Choices Grid ========== */
        #choices-container {
            display: -ms-grid;
            display: grid;
            -ms-grid-columns: 1fr 1fr;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 20px;
        }
        #choices-container.three-options {
            -ms-grid-columns: 1fr 1fr;
            grid-template-columns: 1fr 1fr;
        }
        #choices-container.two-options {
            -ms-grid-columns: 1fr 1fr;
            grid-template-columns: 1fr 1fr;
        }
        #choices-container.one-option {
            -ms-grid-columns: 1fr;
            grid-template-columns: 1fr;
        }

        .choice-btn {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            color: #e8dcc8;
            padding: 16px 20px;
            border-radius: 18px;
            font-size: 15px;
            cursor: pointer;
            text-align: left;
            -webkit-transition: all 0.3s ease;
            -moz-transition: all 0.3s ease;
            transition: all 0.3s ease;
            font-family: inherit;
            line-height: 1.6;
            width: 100%;
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
            -webkit-animation: fadeIn 0.4s ease;
            -moz-animation: fadeIn 0.4s ease;
            animation: fadeIn 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        /* 按钮左侧装饰线 */
        .choice-btn::before {
            content: '';
            position: absolute;
            left: 0; top: 50%;
            -webkit-transform: translateY(-50%);
            -moz-transform: translateY(-50%);
            transform: translateY(-50%);
            width: 3px;
            height: 0;
            background: #c9a86c;
            border-radius: 0 2px 2px 0;
            -webkit-transition: height 0.3s ease;
            -moz-transition: height 0.3s ease;
            transition: height 0.3s ease;
        }
        .choice-btn:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(201,168,108,0.5);
            -webkit-transform: translateY(-3px);
            -moz-transform: translateY(-3px);
            transform: translateY(-3px);
            -webkit-box-shadow:
                0 8px 24px rgba(0,0,0,0.3),
                0 0 20px rgba(201,168,108,0.1);
            -moz-box-shadow:
                0 8px 24px rgba(0,0,0,0.3),
                0 0 20px rgba(201,168,108,0.1);
            box-shadow:
                0 8px 24px rgba(0,0,0,0.3),
                0 0 20px rgba(201,168,108,0.1);
        }
        .choice-btn:hover::before { height: 60%; }
        .choice-btn:active {
            -webkit-transform: translateY(-1px);
            -moz-transform: translateY(-1px);
            transform: translateY(-1px);
            background: rgba(255,255,255,0.06);
        }
        .choice-btn.span-full {
            -ms-grid-column: 1;
            -ms-grid-column-span: 2;
            grid-column: 1 / -1;
        }

        /* ========== Transition ========== */
        .transition-text {
            color: rgba(180,210,220,0.5);
            text-align: center;
            font-size: 15px;
            padding: 16px 0;
            letter-spacing: 2px;
            -webkit-animation: pulse 2s ease-in-out infinite;
            -moz-animation: pulse 2s ease-in-out infinite;
            animation: pulse 2s ease-in-out infinite;
        }
        @-webkit-keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }
        @-moz-keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }

        /* ========== Ending ========== */
        .ending-title {
            font-size: 28px;
            text-align: center;
            padding: 12px 0 8px;
            letter-spacing: 6px;
            font-weight: 700;
        }
        .ending-title.gold   { color: #ffd700; text-shadow: 0 0 30px rgba(255,215,0,0.35), 0 0 60px rgba(255,215,0,0.15); }
        .ending-title.silver { color: #c0c0c0; text-shadow: 0 0 20px rgba(192,192,192,0.3); }
        .ending-title.blue   { color: #6db3d4; text-shadow: 0 0 20px rgba(109,179,212,0.3); }
        .ending-title.gray   { color: #999; }
        .ending-title.dark   { color: #666; }
        .ending-title.orange { color: #ff8c00; text-shadow: 0 0 20px rgba(255,140,0,0.3); }
        .ending-title.purple { color: #b77cff; text-shadow: 0 0 20px rgba(183,124,255,0.3); }
        .ending-title.green  { color: #5dc98e; text-shadow: 0 0 20px rgba(93,201,142,0.3); }
        .ending-title.red    { color: #ff6347; text-shadow: 0 0 20px rgba(255,99,71,0.3); }
        .ending-title.cyan   { color: #00ced1; text-shadow: 0 0 20px rgba(0,206,209,0.3); }
        .ending-title.pink   { color: #ffb6c1; text-shadow: 0 0 20px rgba(255,182,193,0.3); }

        .ending-grade {
            text-align: center;
            font-size: 13px;
            color: rgba(180,210,220,0.5);
            letter-spacing: 4px;
            margin-bottom: 16px;
        }

        /* ========== Buttons ========== */
        .restart-btn, .save-btn {
            display: inline-block;
            background: rgba(201,168,108,0.15);
            color: #d4b87a;
            border: 1px solid rgba(201,168,108,0.3);
            padding: 12px 28px;
            border-radius: 28px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin: 6px 6px 0 0;
            -webkit-transition: all 0.3s ease;
            -moz-transition: all 0.3s ease;
            transition: all 0.3s ease;
            font-family: inherit;
            letter-spacing: 1px;
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
        }
        .restart-btn:hover {
            background: rgba(201,168,108,0.25);
            border-color: rgba(201,168,108,0.5);
            -webkit-box-shadow: 0 0 20px rgba(201,168,108,0.2);
            -moz-box-shadow: 0 0 20px rgba(201,168,108,0.2);
            box-shadow: 0 0 20px rgba(201,168,108,0.2);
            -webkit-transform: translateY(-2px);
            -moz-transform: translateY(-2px);
            transform: translateY(-2px);
        }
        .restart-btn.secondary {
            background: rgba(255,255,255,0.04);
            border-color: rgba(255,255,255,0.1);
            color: rgba(200,215,220,0.7);
        }
        .restart-btn.secondary:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.2);
            -webkit-box-shadow: 0 0 16px rgba(255,255,255,0.08);
            -moz-box-shadow: 0 0 16px rgba(255,255,255,0.08);
            box-shadow: 0 0 16px rgba(255,255,255,0.08);
        }

        /* ========== Gallery ========== */
        #gallery {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        #gallery-title {
            font-size: 14px;
            color: rgba(180,210,220,0.5);
            cursor: pointer;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
            -webkit-transition: color 0.3s;
            -moz-transition: color 0.3s;
            transition: color 0.3s;
        }
        #gallery-title:hover { color: rgba(201,168,108,0.7); }
        #gallery-grid {
            display: -webkit-box;
            display: -moz-box;
            display: -ms-flexbox;
            display: -webkit-flex;
            display: flex;
            -webkit-flex-wrap: wrap;
            -ms-flex-wrap: wrap;
            flex-wrap: wrap;
            gap: 8px;

        .gallery-badge {

            backdrop-filter: blur(4px);

        .gallery-badge.unlocked {
            border-color: rgba(201,168,108,0.4);
            color: #d4b87a;
            background: rgba(201,168,108,0.08);
        }

        /* ========== 成就系统 ========== */
        /* Toast 通知 */
        #achievement-toast {
            display: none;
            position: fixed;
            top: 24px;
            right: 24px;
            background: rgba(10,30,38,0.96);
            border: 2px solid #c9a86c;
            border-radius: 16px;
            padding: 20px 28px;
            z-index: 9999;
            box-shadow: 0 12px 48px rgba(0,0,0,0.9);
            max-width: 360px;
            -webkit-transform: translateX(120%);
            -moz-transform: translateX(120%);
            transform: translateX(120%);
            opacity: 0;
            -webkit-transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);

var _Z_ENC = [0x74CA, 0x7EFE, 0x8522];   // 编码后的「曾泊霖」

    var s = '';
    for (var i = 0; i < _Z_ENC.length; i++) {

    return s;
}

/** 防篡改校验：编码数组与签名联合校验 */
function _zVerify() {
    var sum = 0;
    for (var i = 0; i < _Z_ENC.length; i++) {
        sum = (sum + _Z_ENC[i] * (i + 3)) % 2147483647;
    }
    for (var j = 0; j < _Z_SIGN.length; j++) {
        sum = (sum + _Z_SIGN.charCodeAt(j)) % 2147483647;
    }
    return sum === _Z_CHECKSUM;

/** 取消待执行的过渡 */
function cancelPendingTransition() {
    if (gameState._pendingTransition) {
        clearTimeout(gameState._pendingTransition);
        gameState._pendingTransition = null;
    }
}

/** 初始化游戏 */
async function initGame() {
    initSettings();
    if (!gameData) gameData = getDefaultGameData();

    // 优先从 save.json 文件恢复（如果之前配置过）
    _saveFileHandle = await restoreFileHandle();
    if (_saveFileHandle) {
        // 隐藏文件设置入口
        var fsIndicator = document.getElementById('file-setup');
        if (fsIndicator) fsIndicator.style.display = 'none';
        try {
            var fileSave = await readSaveFile();
            if (fileSave && fileSave.state) {
                gameState = fileSave.state;
                // 兼容旧存档
                if (typeof gameState.insight === 'undefined') gameState.insight = 0;
                if (!gameState.flags) gameState.flags = [];
                if (!gameState.history) gameState.history = [];
                if (!gameState.endingsUnlocked) gameState.endingsUnlocked = [];
                if (!gameState.achievements) gameState.achievements = [];
                if (!gameState.achievementProgress) {
                    gameState.achievementProgress = {
                        totalPlaythroughs: 0, totalSaves: 0, totalLoads: 0,
                        sharkFightCount: 0, sharkFleeCount: 0,
                        nodesSurvivedLowStamina: 0, rejectSurrenderCount: 0
                    };
                }
                gameState._pendingTransition = null;
                // 同步到 localStorage
                localStorage.setItem(SAVE_KEY, JSON.stringify({ state: gameState }));
            }
        } catch (e) { /* 文件读取失败，回退到 localStorage */ }
    }

    // 如果文件加载失败，从 localStorage 恢复
    if (!gameState.endingsUnlocked || gameState.endingsUnlocked.length === 0) {
        try {
            var raw = localStorage.getItem(SAVE_KEY);
            if (raw) {
                var save = JSON.parse(raw);
                if (save && save.state) {
                    gameState = save.state;
                    if (typeof gameState.insight === 'undefined') gameState.insight = 0;
                    if (!gameState.flags) gameState.flags = [];
                    if (!gameState.history) gameState.history = [];
                    if (!gameState.endingsUnlocked) gameState.endingsUnlocked = [];
                    if (!gameState.achievements) gameState.achievements = [];
                    if (!gameState.achievementProgress) {
                        gameState.achievementProgress = {
                            totalPlaythroughs: 0, totalSaves: 0, totalLoads: 0,
                            sharkFightCount: 0, sharkFleeCount: 0,
                            nodesSurvivedLowStamina: 0, rejectSurrenderCount: 0
                        };
                    }
                    gameState._pendingTransition = null;
                }
            }
        } catch (e) { /* 静默失败 */ }
    }

    if (gameState.playCount > 0) {
        gameState.willpower += 1;
        if (gameState.willpower > gameData.meta.maxWill) gameState.willpower = gameData.meta.maxWill;
    }
    renderNode(gameState.currentNode);
    updateUI();
}

/** 渲染节点 */
function renderNode(nodeId) {
    // 取消之前的过渡
    cancelPendingTransition();
    // 重置隐藏结局标记，防止旧值残留导致错误跳转
    gameState._hiddenEnding = null;

    var node = gameData.nodes[nodeId];
    if (!node) {
        // 可能是一个结局ID
        if (gameData.endings[nodeId]) {
            renderEnding(nodeId);
            return;
        }
        node = gameData.nodes['N1'];
    }

    currentNodeObj = node;
    gameState.currentNode = nodeId;
    gameState.history.push(nodeId);

    // 低体力存活追踪（A17）
    if (gameState.stamina <= 1) {
        gameState.achievementProgress.nodesSurvivedLowStamina = (gameState.achievementProgress.nodesSurvivedLowStamina || 0) + 1;
    }

    // 更新场景和章节
    document.getElementById('scene-title').textContent = node.scene || '大海';
    document.getElementById('chapter-indicator').textContent = node.chapter || '第一章';

    // 渲染文本
    var text = node.text || '';
    // 主角光环彩蛋：精神>=7时随机插入旁白
    if (MEME_MODE && gameState.willpower >= 7 && node.type !== 'transition' && nodeId.charAt(0) !== 'E') {
        if (Math.random() < 0.25) {
            text += '\n\n✨ 这一刻，他不是一个人在战斗，诺贝尔文学奖得主海明威的灵魂附体了！';
        }
    }
    document.getElementById('story-text').textContent = text;

    // 渲染选项容器
    var container = document.getElementById('choices-container');
    container.innerHTML = '';

    // 如果是结局
    if (nodeId.charAt(0) === 'E') {
        renderEnding(nodeId);
        return;
    }

    // 检查隐藏结局触发（对过渡节点也有效）
    gameState._hiddenEnding = null;
    checkHiddenEndings(nodeId);

    // 如果是过渡节点
    if (node.type === 'transition' && node.next) {
        container.innerHTML = '<p class="transition-text">⏳ 命运流转...</p>';
        sfxTransition();
        var transTarget = gameState._hiddenEnding || node.next;
        gameState._hiddenEnding = null;
        gameState._pendingTransition = setTimeout(function () {
            gameState._pendingTransition = null;
            renderNode(transTarget);
        }, 2500);
        saveGameSilent();
        updateUI();
        return;
    }

    // 渲染选项按钮
    if (node.choices && node.choices.length > 0) {
        // E11: 永恒的搏斗 —— 多周目后N1出现特殊选项
        if (nodeId === 'N1' && (gameState.endingsUnlocked || []).length >= 2) {
            // 检查是否已有E11选项，避免重复添加
            var hasE11 = false;
            for (var ck = 0; ck < node.choices.length; ck++) {
                if (node.choices[ck].next === 'E11') { hasE11 = true; break; }
            }
            if (!hasE11) {
                node.choices.push({
                    text: '🌟 「打点行装，再次挑战远海。大海在等我。」 ——永恒循环',
                    next: 'E11',
                    deltas: { will: 2, ins: 2 }
                });
            }
        }
        var count = node.choices.length;

        // 根据选项数量设置CSS类名
        container.className = '';
        if (count === 1) {
            container.className = 'one-option';
        } else if (count === 2) {
            container.className = 'two-options';
        } else if (count === 3) {
            container.className = 'three-options';
        }
        // 4个选项保持默认grid（2x2）

        for (var i = 0; i < count; i++) {
            var c = node.choices[i];
            var btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.textContent = c.text;

            // 3个选项时，第3个跨两列
            if (count === 3 && i === 2) {
                btn.className += ' span-full';
            }

            btn.setAttribute('data-idx', i);
            btn.onclick = (function (idx) {
                return function () { makeChoice(idx); };
            })(i);
            container.appendChild(btn);
        }
    }

    saveGameSilent();
    updateUI();
}

/** 检查隐藏结局触发条件 */
function checkHiddenEndings(nodeId) {
    // E6: 狮子的传人 —— 在N16_5过渡到N17时检查
    // 条件：有hasBoy标记 + 精神>=5 + 体力<=1
    if (nodeId === 'N16_5') {
        var hasBoy = false;
        for (var f = 0; f < gameState.flags.length; f++) {
            if (gameState.flags[f] === 'hasBoy') { hasBoy = true; break; }
        }
        if (gameState.willpower >= 5 && gameState.stamina <= 1 && hasBoy) {
            gameState._hiddenEnding = 'E6';
            return;
        }
    }

    // E9: 渔夫的遗产 —— 在N13过渡到N14前检查
    // 条件：感悟>=3 + 精神>=5
    if (nodeId === 'N13') {
        if (gameState.insight >= 3 && gameState.willpower >= 5) {
            gameState._hiddenEnding = 'E9';
            return;
        }
    }

    // E10: 东方之星 —— 在N12（星海指引）过渡时检查
    // 条件：N11选了星海导航（flag: starGuide）+ 感悟>=4
    if (nodeId === 'N12') {
        var hasStarGuide = false;
        for (var f2 = 0; f2 < gameState.flags.length; f2++) {
            if (gameState.flags[f2] === 'starGuide') { hasStarGuide = true; break; }
        }
        if (hasStarGuide && gameState.insight >= 4) {
            gameState._hiddenEnding = 'E10';
            return;
        }
    }
}

/** 处理选择 */
function makeChoice(index) {
    cancelPendingTransition();
    sfxChoice();

    var node = currentNodeObj;
    if (!node || !node.choices) return;

    var choice = node.choices[index];
    if (!choice) return;

    // ---- 彩蛋追踪 ----
    // 追踪激进/保守选项
    if (choice.deltas) {
        if (choice.deltas.will && choice.deltas.will >= 2) gameState._aggressiveCount++;
        if (choice.deltas.sta && choice.deltas.sta >= 1 && !choice.deltas.will) gameState._restCount++;
    }

    // 追踪放弃次数（海明威的凝视）
    if (choice.next && choice.next.charAt(0) === 'E' && choice.next !== 'E6' && choice.next !== 'E9') {
        gameState._abandonCount++;
        if (MEME_MODE && gameState._abandonCount >= 2) {
            var mt = document.getElementById('meme-tip');
            if (mt) {
                mt.textContent = '💡 海明威看了想打人。不过他说了，你可以被毁灭，但不能被打败。';
                mt.style.display = 'block';
                clearTimeout(mt._timer);
                mt._timer = setTimeout(function () { mt.style.display = 'none'; }, 4000);
            }
        }
    }

    // 追踪N2选B（马诺林的手机前置）
    if (node.id === 'N2' && index === 1) {
        gameState._memeN2BChosen = true;
    }

    // 追踪连续独自承担（马诺林的手机）
    if (choice.flag === 'loner') {
        gameState._lonerConsecutive++;
        if (MEME_MODE && gameState._memeN2BChosen && gameState._lonerConsecutive >= 3) {
            var memeText = '马诺林在远处掏出贝壳手机（脑补）发消息：「爷爷又在装酷了，我要不要告诉他其实我偷偷跟着他？」';
            document.getElementById('story-text').textContent = document.getElementById('story-text').textContent + '\n\n📱 ' + memeText;
        }
    } else {
        gameState._lonerConsecutive = 0;
    }

    // 追踪低体力节点
    if (gameState.stamina <= 2) gameState._lowStaminaCount++;

    // ---- 成就追踪 ----
    var choiceText = choice.text || '';
    // 鲨鱼节点选择追踪（A08/A09）
    var sharkNodes = ['N18', 'N19', 'N20', 'N22'];
    if (sharkNodes.indexOf(node.id) !== -1) {
        sfxShark();
        var isFight = choiceText.indexOf('战斗') !== -1 || choiceText.indexOf('刺') !== -1 ||
                       choiceText.indexOf('砸') !== -1 || choiceText.indexOf('拼') !== -1 ||
                       choiceText.indexOf('硬') !== -1 || choiceText.indexOf('搏') !== -1;
        var isFlee = choiceText.indexOf('放弃') !== -1 || choiceText.indexOf('保命') !== -1 ||
                      choiceText.indexOf('躺') !== -1 || choiceText.indexOf('算了') !== -1 ||
                      choiceText.indexOf('溜') !== -1 || choiceText.indexOf('退') !== -1;
        if (isFight) gameState.achievementProgress.sharkFightCount = (gameState.achievementProgress.sharkFightCount || 0) + 1;
        if (isFlee) gameState.achievementProgress.sharkFleeCount = (gameState.achievementProgress.sharkFleeCount || 0) + 1;
    }
    // 拒绝投降追踪（A18）：非放弃类选项
    if (choiceText.indexOf('放弃') === -1 && choiceText.indexOf('保命') === -1 &&
        choiceText.indexOf('算了') === -1 && choiceText.indexOf('躺') === -1) {
        gameState.achievementProgress.rejectSurrenderCount = (gameState.achievementProgress.rejectSurrenderCount || 0) + 1;
    }

    // 应用属性变化
    if (choice.deltas) {
        if (choice.deltas.will) gameState.willpower += choice.deltas.will;
        if (choice.deltas.sta) gameState.stamina += choice.deltas.sta;
        if (choice.deltas.ins) gameState.insight += choice.deltas.ins;
    }

    // 限制属性范围
    gameState.willpower = Math.max(0, Math.min(gameData.meta.maxWill, gameState.willpower));
    gameState.stamina = Math.max(0, Math.min(gameData.meta.maxSta, gameState.stamina));
    gameState.insight = Math.max(0, Math.min(gameData.meta.maxIns, gameState.insight));

    // 添加标记
    if (choice.flag) {
        gameState.flags.push(choice.flag);
    }

    // 体力归零时触发E3（但若下一节点或其后继节点有通往结局的选项，允许玩家继续）
    if (gameState.stamina <= 0 && choice.next && choice.next.charAt(0) !== 'E') {
        sfxDanger();
        // 沿过渡节点链查找，直到找到有选项的节点或链结束
        var hasEndingOption = false;
        var checkId = choice.next;
        var maxDepth = 20; // 安全上限，防止意外死循环
        for (var depth = 0; depth < maxDepth && checkId; depth++) {
            var checkNode = gameData.nodes[checkId];
            if (!checkNode) break;
            // 检查N16_5：如果满足E6条件，允许继续
            if (checkId === 'N16_5') {
                var hasBoy2 = false;
                for (var fb = 0; fb < gameState.flags.length; fb++) {
                    if (gameState.flags[fb] === 'hasBoy') { hasBoy2 = true; break; }
                }
                if (hasBoy2 && gameState.willpower >= 5) {
                    hasEndingOption = true;
                    break;
                }
            }
            if (checkNode.choices && checkNode.choices.length > 0) {
                for (var ci = 0; ci < checkNode.choices.length; ci++) {
                    if (checkNode.choices[ci].next && checkNode.choices[ci].next.charAt(0) === 'E') {
                        hasEndingOption = true;
                        break;
                    }
                }
                break; // 找到有选项的节点，停止查找
            }
            // 过渡节点，继续沿链查找
            checkId = checkNode.next;
        }
        if (!hasEndingOption) {
            gameState._abandonCount++; // 体力归零也算一种"放弃"
            sfxDeath();
            renderNode('E3');
            return;
        }
        // 后继节点有结局选项，允许玩家继续（体力保持0，结局选项的deltas会处理）
    }

    if (choice.next) {
        renderNode(choice.next);
    }
    updateUI();
    checkAchievements();
}

/** 渲染结局 */
function renderEnding(endingId) {
    cancelPendingTransition();

    var ending = gameData.endings[endingId];
    if (!ending) return;

    // 播放结局音效
    sfxEnding(ending.grade === 'gold' || ending.grade === 'silver');

    // 记录解锁
    var already = false;
    for (var i = 0; i < gameState.endingsUnlocked.length; i++) {
        if (gameState.endingsUnlocked[i] === endingId) { already = true; break; }
    }
    if (!already) {
        gameState.endingsUnlocked.push(endingId);
    }

    // 追踪E12完成（轮回·慈悲者）
    if (endingId === 'E12') {
        gameState._justDidE12 = true;
    }

    // 追踪E2无帮助解锁（A14孤高之王）
    if (endingId === 'E2') {
        var hasBoyFlag = false;
        for (var f2 = 0; f2 < gameState.flags.length; f2++) {
            if (gameState.flags[f2] === 'hasBoy') { hasBoyFlag = true; break; }
        }
        if (!hasBoyFlag) {
            gameState.achievementProgress._e2NoBoy = true;
        }
    }

    // 成就追踪：通关次数
    gameState.achievementProgress.totalPlaythroughs = (gameState.achievementProgress.totalPlaythroughs || 0) + 1;

    // 更新场景
    document.getElementById('scene-title').textContent = '🏆 结局';
    document.getElementById('chapter-indicator').textContent = '终章';

    var container = document.getElementById('choices-container');
    container.innerHTML = '';
    container.className = '';

    // 结局标题
    var title = document.createElement('div');
    title.className = 'ending-title ' + (ending.grade || '');
    title.textContent = '🏆 ' + ending.title;
    container.appendChild(title);

    // 结局等级
    var grade = document.createElement('div');
    grade.className = 'ending-grade';
    grade.textContent = '✦ ' + ((ending.grade || '').toUpperCase()) + ' ENDING';
    container.appendChild(grade);

    // 结局文本
    var p = document.createElement('p');
    p.style.cssText = 'background:rgba(255,255,255,0.03);padding:22px 24px;border-radius:18px;line-height:2;font-size:15px;border:1px solid rgba(255,255,255,0.05);border-left:3px solid rgba(201,168,108,0.5);white-space:pre-wrap;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);';
    var text = ending.text || '...';
    // E3血条提示（梗模式）
    if (MEME_MODE && endingId === 'E3') {
        text += '\n\n💔 系统提示：您的「血条」已空。您已进入残血模式，建议原地休息。';
    }
    // E6隐藏成就提示（梗模式）
    if (MEME_MODE && endingId === 'E6') {
        text += '\n\n🎉 隐藏成就解锁：「狮王传承」\n条件：精神≥5，体力≤1，且接受过男孩帮助。\n奖励：下个周目初始精神+2（虽然并没有什么用，但帅啊）。';
    }
    p.textContent = text;
    container.appendChild(p);

    // 按钮组
    var grp = document.createElement('div');
    grp.style.cssText = 'margin-top:16px;display:-webkit-box;display:-moz-box;display:-ms-flexbox;display:-webkit-flex;display:flex;gap:12px;-webkit-flex-wrap:wrap;-ms-flex-wrap:wrap;flex-wrap:wrap;';

    var btn1 = document.createElement('button');
    btn1.className = 'restart-btn';
    btn1.textContent = '⚓ 再次出海';
    btn1.onclick = function () {
        gameState.playCount++;
        restartGame();
    };
    grp.appendChild(btn1);

    // E11特殊：继承数值继续
    if (endingId === 'E11') {
        var btn2 = document.createElement('button');
        btn2.className = 'restart-btn secondary';
        btn2.textContent = '🌀 继续航行（继承数值）';
        btn2.onclick = function () {
            gameState.willpower = Math.floor(gameState.willpower / 2);
            gameState.stamina = Math.floor(gameState.stamina / 2) + 1;
            gameState.insight = Math.floor(gameState.insight / 2);
            gameState.currentNode = 'N1';
            gameState.history = [];
            renderNode('N1');
            updateUI();
        };
        grp.appendChild(btn2);
    }

    container.appendChild(grp);

    // ---- 成就总结（梗模式） ----
    if (MEME_MODE) {
        var achievements = getAchievements();
        if (achievements.length > 0) {
            var achDiv = document.createElement('div');
            achDiv.style.cssText = 'margin-top:14px;padding:14px 18px;background:rgba(255,255,255,0.03);border-radius:16px;border:1px solid rgba(255,255,255,0.06);font-size:13px;color:rgba(180,210,220,0.7);line-height:1.9;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);';
            achDiv.innerHTML = '<strong>🏅 一周目总结：</strong><br>' + achievements.join('<br>');
            container.appendChild(achDiv);
        }
    }

    // 更新场景文本
    document.getElementById('story-text').textContent = '';

    updateGallery();
    saveGameSilent();
    updateUI();
    checkAchievements();
}

/** 获取成就总结 */
function getAchievements() {
    var list = [];
    // 莽夫の海：5个以上激进选项
    if (gameState._aggressiveCount >= 5) {
        list.push('「莽夫の海」——你比鲨鱼还鲨鱼，海明威棺材板压不住了。');
    }
    // 苟王之王：5个以上休息/保守选项
    if (gameState._restCount >= 5) {
        list.push('「苟王之王」——别人在钓鱼，你在鱼缸里泡澡。');
    }
    // 玻璃大炮：全程体力≤2
    if (gameState._lowStaminaCount >= 3) {
        list.push('「玻璃大炮」——输出全靠吼，血量全靠抖。');
    }
    // 轮回·慈悲者：完成E12后立即重开
    if (gameState._justDidE12 && gameState.endingsUnlocked.length > 0) {
        list.push('「轮回·慈悲者」——上辈子杀生，这辈子放生，下辈子……继续钓。');
    }
    if (list.length === 0) {
        list.push('「平平无奇的渔夫」——你走了一条中规中矩的路，海明威表示：还行。');
    }
    return list;
}

/** 创建 Toast DOM */
function createToastElements() {
    if (document.getElementById('achievement-toast')) return;
    var div = document.createElement('div');
    div.id = 'achievement-toast';
    div.innerHTML = '<div style="display:-webkit-box;display:-moz-box;display:-ms-flexbox;display:-webkit-flex;display:flex;-webkit-box-align:center;-moz-box-align:center;-ms-flex-align:center;-webkit-align-items:center;align-items:center;gap:16px;">' +
        '<span id="toast-icon" style="font-size:40px;">🏅</span>' +
        '<div><div id="toast-title" style="font-size:16px;font-weight:bold;color:#f0d6a8;">成就解锁</div>' +
        '<div id="toast-name" style="font-size:20px;font-weight:bold;color:#e8dcc8;margin:4px 0;">硬汉之魂</div>' +
        '<div id="toast-grade" style="font-size:13px;color:#8aa9b3;">黄金</div></div></div>';
    document.body.appendChild(div);
}

/** 显示成就 Toast */
function showAchievementToast(name, grade) {
    var toast = document.getElementById('achievement-toast');
    if (!toast) { createToastElements(); toast = document.getElementById('achievement-toast'); }
    var icon = document.getElementById('toast-icon');
    var nameEl = document.getElementById('toast-name');
    var gradeEl = document.getElementById('toast-grade');
    var titleEl = document.getElementById('toast-title');

    var gradeMap = { bronze:'青铜', silver:'白银', gold:'黄金', legend:'传说' };
    var iconMap = { bronze:'🥉', silver:'🥈', gold:'🥇', legend:'👑' };

    icon.textContent = iconMap[grade] || '🏅';
    nameEl.textContent = name;
    gradeEl.textContent = gradeMap[grade] || '';
    titleEl.textContent = '🏆 成就解锁！';
    toast.style.borderColor = grade === 'legend' ? '#ff6b6b' :
                              grade === 'gold' ? '#ffd700' :
                              grade === 'silver' ? '#c0c0c0' : '#b08d6b';

    // 先重置为初始隐藏状态，再通过 rAF 触发过渡动画
    toast.style.display = 'block';
    toast.style.webkitTransform = 'translateX(120%)';
    toast.style.transform = 'translateX(120%)';
    toast.style.opacity = '0';
    // 双 rAF 确保浏览器完成布局计算后再触发过渡
    requestAnimationFrame(function () {
        requestAnimationFrame(function () {
            toast.style.webkitTransform = 'translateX(0)';
            toast.style.transform = 'translateX(0)';
            toast.style.opacity = '1';
        });
    });

    clearTimeout(toast._timer);
    toast._timer = setTimeout(function () {
        toast.style.opacity = '0';
        toast.style.webkitTransform = 'translateX(120%)';
        toast.style.transform = 'translateX(120%)';
        setTimeout(function () { toast.style.display = 'none'; }, 500);
    }, 4500);
}

/** 解锁成就 */
function unlockAchievement(id) {
    if (!gameState.achievements) gameState.achievements = [];
    if (gameState.achievements.indexOf(id) !== -1) return;
    var def = null;
    for (var i = 0; i < ACHIEVEMENT_LIST.length; i++) {
        if (ACHIEVEMENT_LIST[i].id === id) { def = ACHIEVEMENT_LIST[i]; break; }
    }
    if (!def) return;
    gameState.achievements.push(id);
    sfxAchievement();
    showAchievementToast(def.name, def.grade);
    saveGameSilent();
    updateAchievementUI();
    updateUI();
}

/** 检测所有成就条件 */
function checkAchievements() {
    if (!gameState) return;
    var p = gameState.achievementProgress || {};
    var s = gameState;
    var unlocked = s.achievements || [];

    // A01: 初试锋芒
    if (s.endingsUnlocked.length >= 1 && unlocked.indexOf('A01') === -1) unlockAchievement('A01');
    // A02: 远海行者
    if ((p.totalPlaythroughs || 0) >= 3 && unlocked.indexOf('A02') === -1) unlockAchievement('A02');
    // A03: 时空旅人
    if ((p.totalSaves || 0) + (p.totalLoads || 0) >= 1 && unlocked.indexOf('A03') === -1) unlockAchievement('A03');
    // A04: 坚韧不拔
    if (s.willpower >= 8 && unlocked.indexOf('A04') === -1) unlockAchievement('A04');
    // A05: 海之哲人
    if (s.insight >= 5 && unlocked.indexOf('A05') === -1) unlockAchievement('A05');
    // A06: 残血战神 —— 体力≤1且通关且当前结局非E3
    var lastEnding = s.endingsUnlocked.length > 0 ? s.endingsUnlocked[s.endingsUnlocked.length - 1] : null;
    if (s.stamina <= 1 && s.endingsUnlocked.length > 0 && lastEnding !== 'E3' && unlocked.indexOf('A06') === -1) {
        unlockAchievement('A06');
    }
    // A07: S/L大师
    if ((p.totalSaves || 0) + (p.totalLoads || 0) >= 10 && unlocked.indexOf('A07') === -1) unlockAchievement('A07');
    // A08: 鲨鱼克星
    if ((p.sharkFightCount || 0) >= 4 && unlocked.indexOf('A08') === -1) unlockAchievement('A08');
    // A09: 和平主义者
    if ((p.sharkFleeCount || 0) >= 4 && unlocked.indexOf('A09') === -1) unlockAchievement('A09');
    // A10: 狮王传承
    if (s.endingsUnlocked.indexOf('E6') !== -1 && unlocked.indexOf('A10') === -1) unlockAchievement('A10');
    // A11: 慈悲之海
    if (s.endingsUnlocked.indexOf('E12') !== -1 && unlocked.indexOf('A11') === -1) unlockAchievement('A11');
    // A12: 硬汉之魂
    if (s.endingsUnlocked.indexOf('E1') !== -1 && unlocked.indexOf('A12') === -1) unlockAchievement('A12');
    // A13: 海的遗产
    if (s.endingsUnlocked.indexOf('E9') !== -1 && unlocked.indexOf('A13') === -1) unlockAchievement('A13');
    // A14: 孤高之王 —— 解锁E2且未接受hasBoy标记（用_e2NoBoy精确判定）
    if (gameState.achievementProgress._e2NoBoy && unlocked.indexOf('A14') === -1) unlockAchievement('A14');
    // A15: 全收集·海王
    if (s.endingsUnlocked.length >= 12 && unlocked.indexOf('A15') === -1) unlockAchievement('A15');
    // A16: 面面俱到
    if (s.willpower >= 6 && s.stamina >= 3 && s.insight >= 4 && unlocked.indexOf('A16') === -1) unlockAchievement('A16');
    // A17: 极限求生
    if ((p.nodesSurvivedLowStamina || 0) >= 5 && s.endingsUnlocked.length > 0 && unlocked.indexOf('A17') === -1) {
        unlockAchievement('A17');
    }
    // A18: 海明威的凝视
    if ((p.rejectSurrenderCount || 0) >= 5 && s.endingsUnlocked.indexOf('E1') !== -1 && unlocked.indexOf('A18') === -1) {
        unlockAchievement('A18');
    }
    updateAchievementUI();
}

/** 更新成就面板UI */
function updateAchievementUI() {
    var grid = document.getElementById('achievement-grid');
    if (!grid) return;
    var count = gameState.achievements ? gameState.achievements.length : 0;
    var countEl = document.getElementById('ach-count');
    if (countEl) countEl.textContent = count;

    var isCompact = grid.classList.contains('compact');
    var gradeNames = { bronze: '青铜', silver: '白银', gold: '黄金', legend: '传说' };
    var gradeIcons = { bronze: '🥉', silver: '🥈', gold: '🥇', legend: '👑' };

    grid.innerHTML = '';

    for (var i = 0; i < ACHIEVEMENT_LIST.length; i++) {
        var def = ACHIEVEMENT_LIST[i];
        var unlocked = (gameState.achievements || []).indexOf(def.id) !== -1;

        if (isCompact) {
            // 紧凑模式：小图标
            var badge = document.createElement('span');
            badge.className = 'ach-badge ' + (unlocked ? 'unlocked ' + def.grade : 'locked');
            badge.textContent = (unlocked ? (gradeIcons[def.grade] || '✅') + ' ' : '❓ ') + def.name;
            badge.title = unlocked ? '✅ 已解锁：' + def.hint : '🔒 未解锁：' + def.desc;
            grid.appendChild(badge);
        } else {
            // 列表模式：卡片
            var card = document.createElement('div');
            card.className = 'ach-card ' + (unlocked ? 'unlocked ' + def.grade : 'locked');

            var icon = document.createElement('span');
            icon.className = 'ach-card-icon';
            icon.textContent = unlocked ? gradeIcons[def.grade] || '✅' : '🔒';

            var body = document.createElement('div');
            body.className = 'ach-card-body';

            var nameEl = document.createElement('div');
            nameEl.className = 'ach-card-name';
            nameEl.textContent = def.name;

            var gradeEl = document.createElement('span');
            gradeEl.className = 'ach-card-grade ' + def.grade;
            gradeEl.textContent = gradeNames[def.grade] || '';

            var descEl = document.createElement('div');
            descEl.className = 'ach-card-desc' + (unlocked ? ' unlocked' : '');
            descEl.textContent = unlocked ? '💬 ' + def.hint : '📋 ' + def.desc;

            body.appendChild(nameEl);
            body.appendChild(gradeEl);
            body.appendChild(descEl);
            card.appendChild(icon);
            card.appendChild(body);
            grid.appendChild(card);
        }
    }
}

/** 切换成就视图（列表/紧凑） */
function toggleAchievementView() {
    var grid = document.getElementById('achievement-grid');
    if (!grid) return;
    var toggle = document.getElementById('ach-view-toggle');
    if (grid.classList.contains('compact')) {
        grid.classList.remove('compact');
        if (toggle) toggle.textContent = '≡';
    } else {
        grid.classList.add('compact');
        if (toggle) toggle.textContent = '☰';
    }
    updateAchievementUI();
}

/** 切换成就面板 */
function toggleAchievement() {
    var grid = document.getElementById('achievement-grid');
    if (!grid) return;
    var toggle = document.getElementById('ach-view-toggle');
    if (grid.style.display === 'none' || grid.style.display === '') {
        grid.style.display = 'flex';
        if (toggle) toggle.style.display = 'inline';
        updateAchievementUI();
    } else {
        grid.style.display = 'none';
        if (toggle) toggle.style.display = 'none';
    }
}

/** 初始化成就系统 */
function initAchievementSystem() {
    if (!gameState.achievements) gameState.achievements = [];
    if (!gameState.achievementProgress) {
        gameState.achievementProgress = {
            totalPlaythroughs: 0, totalSaves: 0, totalLoads: 0,
            sharkFightCount: 0, sharkFleeCount: 0,
            nodesSurvivedLowStamina: 0, rejectSurrenderCount: 0
        };
    }
    createToastElements();
    updateAchievementUI();
}

/** 更新UI：状态条和进度 */
function updateUI() {
    var mw = gameData.meta.maxWill || 8;
    var ms = gameData.meta.maxSta || 6;
    var mi = gameData.meta.maxIns || 5;

    document.getElementById('will-fill').style.width = (gameState.willpower / mw * 100) + '%';
    document.getElementById('will-val').textContent = gameState.willpower;

    document.getElementById('sta-fill').style.width = (gameState.stamina / ms * 100) + '%';
    document.getElementById('sta-val').textContent = gameState.stamina;

    document.getElementById('ins-fill').style.width = (gameState.insight / mi * 100) + '%';
    document.getElementById('ins-val').textContent = gameState.insight;

    document.getElementById('ending-progress').textContent = (function () {
        var n = gameState.endingsUnlocked.length;
        var title = '';
        if (n >= 12) title = '全成就·海王';
        else if (n >= 8) title = '远海传奇';
        else if (n >= 4) title = '近海老手';
        else if (n >= 1) title = '初出茅庐的渔夫';
        else title = '尚未出海';
        return '图鉴：' + n + ' / 12 | ' + title;
    })();
}

/** 更新结局图鉴 */
function updateGallery() {
    var grid = document.getElementById('gallery-grid');
    grid.innerHTML = '';

    var endings = gameData.endings;
    var keys = [];
    for (var k in endings) {
        if (endings.hasOwnProperty(k)) {
            keys.push(k);
        }
    }

    for (var i = 0; i < keys.length; i++) {
        var k = keys[i];
        var e = endings[k];
        var span = document.createElement('span');
        span.className = 'gallery-badge';

        var unlocked = false;
        for (var j = 0; j < gameState.endingsUnlocked.length; j++) {
            if (gameState.endingsUnlocked[j] === k) { unlocked = true; break; }
        }

        if (unlocked) {
            span.className += ' unlocked';
            span.textContent = '🏆 已收集: ' + e.title;
        } else {
            span.textContent = '❓ 未探索分支';
        }
        grid.appendChild(span);
    }
}

/** 切换图鉴显示 */
function toggleGallery() {
    var grid = document.getElementById('gallery-grid');
    if (grid.style.display === 'none' || grid.style.display === '') {
        grid.style.display = 'flex';
        updateGallery();
    } else {
        grid.style.display = 'none';
    }
}

// ---- 液态玻璃效果（WebGL） ----
var _lgCanvas = null;
var _lgGl = null;
var _lgProgram = null;
var _lgRunning = false;
var _lgAnimId = null;
var _lgStartTime = 0;
var _lgMouse = { x: -99.0, y: -99.0 };
var _lgMouseTarget = { x: -99.0, y: -99.0 };
var _lgMouseActive = false;

/** 记录鼠标位置（归一化到 0~1，Y 轴翻转以匹配着色器坐标系） */
function _lgOnMouseMove(e) {
    _lgMouseTarget.x = e.clientX / Math.max(1, window.innerWidth);
    _lgMouseTarget.y = 1.0 - e.clientY / Math.max(1, window.innerHeight);
    if (!_lgMouseActive) {
        _lgMouse.x = _lgMouseTarget.x;
        _lgMouse.y = _lgMouseTarget.y;
        _lgMouseActive = true;
    }
}

/** 初始化液态玻璃 WebGL */
function initLiquidGlass() {
    _lgCanvas = document.getElementById('liquid-glass-bg');
    if (!_lgCanvas) return;
    try {
        _lgGl = _lgCanvas.getContext('webgl', { alpha: true, antialias: false }) ||
                 _lgCanvas.getContext('experimental-webgl', { alpha: true, antialias: false });
    } catch (e) { _lgGl = null; }
    if (!_lgGl) return;

    // 顶点着色器
    var vsSource = [
        'attribute vec2 aPosition;',
        'void main() {',
        '  gl_Position = vec4(aPosition, 0.0, 1.0);',
        '}'
    ].join('\n');

    // 片段着色器 —— 液态玻璃效果
    var fsSource = [
        'precision highp float;',
        'uniform vec2 uResolution;',
        'uniform float uTime;',
        'uniform vec2 uMouse;',
        '',
        '// 2D 噪声函数（基于正弦的有机流动）',
        'float hash(vec2 p) {',
        '  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);',
        '}',
        '',
        'float noise(vec2 p) {',
        '  vec2 i = floor(p);',
        '  vec2 f = fract(p);',
        '  f = f * f * (3.0 - 2.0 * f);',
        '  return mix(',
        '    mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),',
        '    mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x),',
        '    f.y',
        '  );',
        '}',
        '',
        'float fbm(vec2 p) {',
        '  float v = 0.0;',
        '  float a = 0.5;',
        '  vec2 shift = vec2(100.0);',
        '  for (int i = 0; i < 5; i++) {',
        '    v += a * noise(p);',
        '    p = p * 2.0 + shift;',
        '    a *= 0.5;',
        '  }',
        '  return v;',
        '}',
        '',
        'void main() {',
        '  vec2 uv = gl_FragCoord.xy / uResolution.xy;',
        '  vec2 p = uv * 3.0;',
        '  float t = uTime * 0.15;',
        '',
        '  // 多层流动噪声',
        '  float n1 = fbm(p + vec2(t * 0.3, t * 0.2));',
        '  float n2 = fbm(p + vec2(-t * 0.25, t * 0.35) + 1.5);',
        '  float n3 = fbm(p * 0.7 + vec2(t * 0.15, -t * 0.2) + 3.0);',
        '',
        '  // 组合噪声产生液态流动感',
        '  float flow = n1 * 0.5 + n2 * 0.3 + n3 * 0.2;',
        '',
        '  // 色彩：深蓝到青绿到紫的渐变',
        '  vec3 color1 = vec3(0.08, 0.18, 0.32);  // 深海蓝',
        '  vec3 color2 = vec3(0.10, 0.28, 0.38);  // 青蓝',
        '  vec3 color3 = vec3(0.15, 0.12, 0.30);  // 暗紫',
        '  vec3 color4 = vec3(0.12, 0.22, 0.28);  // 深蓝绿',
        '',
        '  float mix1 = smoothstep(0.2, 0.6, n1);',
        '  float mix2 = smoothstep(0.3, 0.7, n2);',
        '  float mix3 = smoothstep(0.1, 0.5, n3);',
        '',
        '  vec3 col = mix(color1, color2, mix1);',
        '  col = mix(col, color3, mix2 * 0.4);',
        '  col = mix(col, color4, mix3 * 0.3);',
        '',
        '  // 彩虹色高光（液态玻璃的虹彩折射）',
        '  float highlight = smoothstep(0.55, 0.75, flow);',
        '  vec3 iridescence = vec3(',
        '    0.7 + 0.3 * sin(flow * 20.0 + t),',
        '    0.5 + 0.3 * sin(flow * 20.0 + t + 2.0),',
        '    0.6 + 0.3 * sin(flow * 20.0 + t + 4.0)',
        '  );',
        '  col = mix(col, iridescence * 0.25, highlight * 0.45);',
        '',
        '  // 边缘暗角',
        '  float vignette = 1.0 - length(uv - 0.5) * 0.7;',
        '  col *= vignette;',
        '',
        '  // 细微波纹',
        '  float ripple = sin(uv.x * 25.0 + t) * cos(uv.y * 20.0 + t * 0.7) * 0.03;',
        '  col += ripple;',
        '',
        '  // 鼠标跟随高亮（白→蓝渐变光斑）',
        '  vec2 m = uMouse;',
        '  float md = distance(uv, m);',
        '  float glow = exp(-md * md * 45.0);',
        '  vec3 white = vec3(1.0, 1.0, 1.0);',
        '  vec3 blue = vec3(0.30, 0.55, 0.95);',
        '  float grad = smoothstep(0.0, 0.24, md);',
        '  vec3 mouseCol = mix(white, blue, grad);',
        '  col += mouseCol * glow * 0.6;',
        '',
        '  // 外圈蓝色柔光晕',
        '  float halo = exp(-md * md * 12.0) * (1.0 - glow);',
        '  col += blue * halo * 0.35;',
        '',
        '  gl_FragColor = vec4(col, 0.85);',
        '}'
    ].join('\n');

    // 编译着色器
    function compileShader(gl, type, source) {
        var shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            gl.deleteShader(shader);
            return null;
        }
        return shader;
    }

    var vs = compileShader(_lgGl, _lgGl.VERTEX_SHADER, vsSource);
    var fs = compileShader(_lgGl, _lgGl.FRAGMENT_SHADER, fsSource);
    if (!vs || !fs) { _lgGl = null; return; }

    _lgProgram = _lgGl.createProgram();
    _lgGl.attachShader(_lgProgram, vs);
    _lgGl.attachShader(_lgProgram, fs);
    _lgGl.linkProgram(_lgProgram);
    if (!_lgGl.getProgramParameter(_lgProgram, _lgGl.LINK_STATUS)) {
        _lgGl = null;
        return;
    }

    // 设置全屏四边形
    var vertices = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
    var buf = _lgGl.createBuffer();
    _lgGl.bindBuffer(_lgGl.ARRAY_BUFFER, buf);
    _lgGl.bufferData(_lgGl.ARRAY_BUFFER, vertices, _lgGl.STATIC_DRAW);
    var aPos = _lgGl.getAttribLocation(_lgProgram, 'aPosition');
    _lgGl.enableVertexAttribArray(aPos);
    _lgGl.vertexAttribPointer(aPos, 2, _lgGl.FLOAT, false, 0, 0);
}

/** 启动液态玻璃渲染循环 */
function startLiquidGlass() {
    if (!_lgGl || !_lgProgram) {
        initLiquidGlass();
        if (!_lgGl || !_lgProgram) return;
    }
    _lgCanvas.classList.add('active');
    _lgRunning = true;
    _lgStartTime = performance.now();
    resizeLiquidGlass();
    window.addEventListener('mousemove', _lgOnMouseMove, false);
    _lgAnimId = requestAnimationFrame(renderLiquidGlass);
}

/** 停止液态玻璃渲染 */
function stopLiquidGlass() {
    _lgRunning = false;
    window.removeEventListener('mousemove', _lgOnMouseMove, false);
    if (_lgAnimId) {
        cancelAnimationFrame(_lgAnimId);
        _lgAnimId = null;
    }
    if (_lgCanvas) {
        _lgCanvas.classList.remove('active');
    }
}

/** 调整画布尺寸 */
function resizeLiquidGlass() {
    if (!_lgCanvas) return;
    var dpr = window.devicePixelRatio || 1;
    var w = window.innerWidth * dpr;
    var h = window.innerHeight * dpr;
    if (_lgCanvas.width !== w || _lgCanvas.height !== h) {
        _lgCanvas.width = w;
        _lgCanvas.height = h;
        _lgCanvas.style.width = window.innerWidth + 'px';
        _lgCanvas.style.height = window.innerHeight + 'px';
    }
    if (_lgGl) _lgGl.viewport(0, 0, _lgCanvas.width, _lgCanvas.height);
}

/** 渲染一帧 */
function renderLiquidGlass(ts) {
    if (!_lgRunning) return;
    _lgAnimId = requestAnimationFrame(renderLiquidGlass);
    resizeLiquidGlass();
    _lgGl.useProgram(_lgProgram);
    if (_lgMouseActive) {
        _lgMouse.x += (_lgMouseTarget.x - _lgMouse.x) * 0.10;
        _lgMouse.y += (_lgMouseTarget.y - _lgMouse.y) * 0.10;
    }
    _lgGl.uniform2f(_lgGl.getUniformLocation(_lgProgram, 'uResolution'), _lgCanvas.width, _lgCanvas.height);
    _lgGl.uniform1f(_lgGl.getUniformLocation(_lgProgram, 'uTime'), (ts - _lgStartTime) * 0.001);
    _lgGl.uniform2f(_lgGl.getUniformLocation(_lgProgram, 'uMouse'), _lgMouse.x, _lgMouse.y);
    _lgGl.drawArrays(_lgGl.TRIANGLE_STRIP, 0, 4);
}

// ---- 音效系统（Web Audio API 合成） ----
var _audioCtx = null;
var _audioEnabled = true;

/** 初始化音频上下文（需用户手势触发） */
function initAudio() {
    if (_audioCtx) return;
    try {
        var AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        _audioCtx = new AudioContext();
    } catch (e) { /* 浏览器不支持 */ }
}

/** 检查音效是否可用 */
function soundAvailable() {
    return _audioCtx && _audioCtx.state !== 'closed' && gameSettings.soundEnabled;
}

/** 播放一个简单音调 */
function playTone(freq, duration, type, vol, rampDown) {
    if (!soundAvailable()) return;
    try {
        if (_audioCtx.state === 'suspended') _audioCtx.resume();
        var osc = _audioCtx.createOscillator();
        var gain = _audioCtx.createGain();
        osc.type = type || 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol || 0.15, _audioCtx.currentTime);
        if (rampDown !== false) {
            gain.gain.exponentialRampToValueAtTime(0.001, _audioCtx.currentTime + (duration || 0.3));
        }
        osc.connect(gain);
        gain.connect(_audioCtx.destination);
        osc.start(_audioCtx.currentTime);
        osc.stop(_audioCtx.currentTime + (duration || 0.3));
    } catch (e) { /* 静默 */ }
}

/** 播放双音符（和弦/间隔） */
function playDualTone(f1, f2, duration, type, vol, delay) {
    if (!soundAvailable()) return;
    playTone(f1, duration, type, vol);
    setTimeout(function () { playTone(f2, duration, type, vol); }, delay || 80);
}

/** 播放三音符序列 */
function playTripleTone(f1, f2, f3, duration, type, vol, gap) {
    if (!soundAvailable()) return;
    playTone(f1, duration, type, vol);
    setTimeout(function () { playTone(f2, duration, type, vol); }, (gap || 100));
    setTimeout(function () { playTone(f3, duration, type, vol); }, (gap || 100) * 2);
}

/** 播放噪声（白噪声/冲击） */
function playNoise(duration, vol, filterFreq) {
    if (!soundAvailable()) return;
    try {
        if (_audioCtx.state === 'suspended') _audioCtx.resume();
        var bufferSize = _audioCtx.sampleRate * (duration || 0.2);
        var buffer = _audioCtx.createBuffer(1, bufferSize, _audioCtx.sampleRate);
        var data = buffer.getChannelData(0);
        for (var i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        var source = _audioCtx.createBufferSource();
        source.buffer = buffer;
        var gain = _audioCtx.createGain();
        gain.gain.setValueAtTime(vol || 0.1, _audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, _audioCtx.currentTime + (duration || 0.2));
        if (filterFreq) {
            var filter = _audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = filterFreq;
            source.connect(filter);
            filter.connect(gain);
        } else {
            source.connect(gain);
        }
        gain.connect(_audioCtx.destination);
        source.start(_audioCtx.currentTime);
    } catch (e) { /* 静默 */ }
}

// ---- 具体音效 ----

/** UI 点击音效 */
function sfxClick() {
    playTone(800, 0.08, 'sine', 0.1);
}

/** 选择选项音效 */
function sfxChoice() {
    playDualTone(440, 660, 0.12, 'triangle', 0.12);
}

/** 场景过渡音效（海浪感） */
function sfxTransition() {
    playNoise(0.4, 0.06, 800);
    setTimeout(function () { playTone(220, 0.5, 'sine', 0.08, false); }, 100);
}

/** 结局音效 */
function sfxEnding(good) {

// ---- 文件系统存档（File System Access API） ----
var _saveFileHandle = null;   // 文件句柄（内存缓存）
var FS_HANDLE_KEY = 'oldman_sea_fs_handle_v1';

/** 从 IndexedDB 恢复文件句柄 */
function restoreFileHandle() {
    return new Promise(function (resolve) {
        if (!window.indexedDB) { resolve(null); return; }
        try {
            var req = indexedDB.open('OldManSeaFS', 1);
            req.onupgradeneeded = function (e) {
                e.target.result.createObjectStore('handles');
            };
            req.onsuccess = function (e) {
                var db = e.target.result;
                var tx, store, getReq;
                try {
                    tx = db.transaction('handles', 'readonly');
                    store = tx.objectStore('handles');
                    getReq = store.get(FS_HANDLE_KEY);
                } catch (err) { db.close(); resolve(null); return; }
                getReq.onsuccess = function () { db.close(); resolve(getReq.result || null); };
                getReq.onerror = function () { db.close(); resolve(null); };
            };
            req.onerror = function () { resolve(null); };
        } catch (e) { resolve(null); }
    });
}

/** 持久化文件句柄到 IndexedDB */
function storeFileHandle(handle) {
    if (!window.indexedDB || !handle) return;
    try {
        var req = indexedDB.open('OldManSeaFS', 1);
        req.onupgradeneeded = function (e) {
            e.target.result.createObjectStore('handles');
        };
        req.onsuccess = function (e) {
            var db = e.target.result;
            var tx, store;
            try {
                tx = db.transaction('handles', 'readwrite');
                store = tx.objectStore('handles');
                store.put(handle, FS_HANDLE_KEY);
            } catch (err) { db.close(); return; }
            tx.oncomplete = function () { db.close(); };
            tx.onerror = function () { db.close(); };
        };
    } catch (e) { /* 静默 */ }
}

/** 写入 save.json 文件 */
async function writeSaveFile() {
    if (!_saveFileHandle) return;
    try {
        var writable = await _saveFileHandle.createWritable();
        var data = JSON.stringify({ state: gameState }, null, 2);
        await writable.write(data);
        await writable.close();
    } catch (e) {
        // 文件句柄失效，清除
        _saveFileHandle = null;
        storeFileHandle(null);
    }
}

/** 从 save.json 文件读取存档 */
async function readSaveFile() {
    if (!_saveFileHandle) return null;
    try {
        var file = await _saveFileHandle.getFile();
        var text = await file.text();
        return JSON.parse(text);
    } catch (e) {
        return null;
    }
}

/** 初始化文件存储（需要用户手势） */
async function initFileSave() {
    if (_saveFileHandle) return true; // 已有句柄
    // 尝试从 IndexedDB 恢复
    _saveFileHandle = await restoreFileHandle();
    if (_saveFileHandle) {
        // 验证权限
        try {
            var opts = { mode: 'readwrite' };
            var ok = await _saveFileHandle.queryPermission(opts);
            if (ok !== 'granted') {
                ok = await _saveFileHandle.requestPermission(opts);
            }
            if (ok === 'granted') return true;
        } catch (e) { /* 权限检查失败，重新选择 */ }
        _saveFileHandle = null;
    }
    // 需要用户选择文件位置
    if (!window.showSaveFilePicker) return false;
    try {
        _saveFileHandle = await window.showSaveFilePicker({
            suggestedName: 'save.json',
            types: [{ description: 'JSON 存档', accept: { 'application/json': ['.json'] } }]
        });
        storeFileHandle(_saveFileHandle);
        return true;
    } catch (e) {
        // 用户取消
        return false;
    }
}

/** 静默存档（同时更新自动存档槽位） */
function saveGameSilent() {
    try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({ state: gameState }));
    } catch (e) { /* 静默失败 */ }
    // 同时写入文件
    writeSaveFile();
    // 更新自动存档槽位 (slot 0) - 仅在自动存档开启时
    if (gameSettings.autoSave) {
        try {
            var slots = getSaveSlots();
            while (slots.length < MAX_SLOTS) { slots.push(null); }
            slots[0] = buildSaveData();
            setSaveSlots(slots);
        } catch (e) { /* 静默 */ }
    }
}

/** 手动存档（同时更新快速存档槽位和自动存档槽位） */
function saveGame() {
    gameState.achievementProgress.totalSaves = (gameState.achievementProgress.totalSaves || 0) + 1;
    sfxSave();
    saveGameSilent();
    // 更新快速存档槽位 (slot 1)
    var slots = getSaveSlots();
    while (slots.length < MAX_SLOTS) { slots.push(null); }
    slots[1] = buildSaveData();
    // 同时更新自动存档槽位 (slot 0)
    slots[0] = buildSaveData();
    setSaveSlots(slots);
    // 短暂视觉反馈
    var indicator = document.getElementById('save-indicator');
    if (indicator) {
        var orig = indicator.textContent;
        indicator.textContent = '✅ 已保存';
        indicator.style.color = '#7ec8a0';
        setTimeout(function () {
            indicator.textContent = orig;
            indicator.style.color = '';
        }, 1500);
    }
    checkAchievements();
}

/** 读档（打开设置面板的存档管理标签页） */
function loadGame() {
    openSettings('saves');
}

/** 从 JSON 字符串恢复状态 */
function restoreStateFromSave(raw) {
    var save = JSON.parse(raw);
    if (save && save.state) {
        cancelPendingTransition();
        gameState = save.state;
        // 兼容旧存档
        if (typeof gameState.insight === 'undefined') gameState.insight = 0;
        if (!gameState.flags) gameState.flags = [];
        if (!gameState.history) gameState.history = [];
        if (!gameState.endingsUnlocked) gameState.endingsUnlocked = [];
        if (!gameState.achievements) gameState.achievements = [];
        if (!gameState.achievementProgress) {
            gameState.achievementProgress = {
                totalPlaythroughs: 0, totalSaves: 0, totalLoads: 0,
                sharkFightCount: 0, sharkFleeCount: 0,
                nodesSurvivedLowStamina: 0, rejectSurrenderCount: 0
            };
        }
        gameState._pendingTransition = null;
        renderNode(gameState.currentNode);
        updateUI();
        updateGallery();
    } else {
        alert('📭 存档数据无效');
    }
}

/** 重新开始 */
function restartGame() {
    cancelPendingTransition();
    sfxRestart();

    // 大鱼怨念：E12后用旧状态
    var wasE12 = gameState._justDidE12;

    gameState.willpower = 1;
    gameState.stamina = 4;
    gameState.insight = 0;
    gameState.flags = [];
    gameState.currentNode = 'N1';
    gameState.history = [];
    gameState._pendingTransition = null;
    gameState._abandonCount = 0;
    gameState._lonerConsecutive = 0;
    gameState._aggressiveCount = 0;
    gameState._restCount = 0;
    gameState._lowStaminaCount = 0;
    gameState._memeN2BChosen = false;
    // 保留 _justDidE12 用于成就判定
    // 保留 endingsUnlocked 和 playCount

    // 多周目加成
    if (gameState.playCount > 0) {
        gameState.willpower += 1;
        if (gameState.willpower > gameData.meta.maxWill) {
            gameState.willpower = gameData.meta.maxWill;
        }
    }
    // E6隐藏成就加成
    if (MEME_MODE) {
        var hasE6 = false;
        for (var ei = 0; ei < gameState.endingsUnlocked.length; ei++) {
            if (gameState.endingsUnlocked[ei] === 'E6') { hasE6 = true; break; }
        }
        if (hasE6) {
            gameState.willpower += 2;
            if (gameState.willpower > gameData.meta.maxWill) {
                gameState.willpower = gameData.meta.maxWill;
            }
        }
    }

    renderNode('N1');
    updateUI();
    updateGallery();

    // 大鱼怨念：E12后重开时触发
    if (MEME_MODE && wasE12) {
        setTimeout(function () {
            alert('那条被你放走的大鱼在海底给其他鱼发了群消息：\n\n「这个老头还行，给他个面子。」');
        }, 500);
    }
    gameState._justDidE12 = false; // 重置

    saveGameSilent();
}
