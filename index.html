/** 初始化设置 */
function initSettings() {
    try {
        var raw = localStorage.getItem(SETTINGS_KEY);
        if (raw) {
            var saved = JSON.parse(raw);
            if (saved) {
                if (typeof saved.memeMode === 'boolean') gameSettings.memeMode = saved.memeMode;
                if (typeof saved.autoSave === 'boolean') gameSettings.autoSave = saved.autoSave;
                if (typeof saved.soundEnabled === 'boolean') gameSettings.soundEnabled = saved.soundEnabled;
                if (typeof saved.liquidGlassEnabled === 'boolean') gameSettings.liquidGlassEnabled = saved.liquidGlassEnabled;
                if (typeof saved.textSpeed === 'number') gameSettings.textSpeed = saved.textSpeed;
            }
        }
    } catch (e) { /* 静默 */ }
    // 同步 MEME_MODE
    MEME_MODE = gameSettings.memeMode;
}

/** 保存设置到 localStorage */
function saveSettings() {
    try {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(gameSettings));
    } catch (e) { /* 静默 */ }
    MEME_MODE = gameSettings.memeMode;
}

/** 打开设置面板 */
function openSettings(tab) {
    var overlay = document.getElementById('settings-overlay');
    if (!overlay) return;
    overlay.style.display = 'flex';
    var targetTab = tab || 'saves';
    switchSettingsTab(targetTab);
}

/** 关闭设置面板 */
function closeSettings() {
    var overlay = document.getElementById('settings-overlay');
    if (overlay) overlay.style.display = 'none';
}

/** 切换设置标签页 */
function switchSettingsTab(tabName) {
    var tabs = document.querySelectorAll('.settings-tab');
    for (var i = 0; i < tabs.length; i++) {
        if (tabs[i].getAttribute('data-tab') === tabName) {
            tabs[i].classList.add('active');
        } else {
            tabs[i].classList.remove('active');
        }
    }
    var contents = document.querySelectorAll('.settings-tab-content');
    for (var j = 0; j < contents.length; j++) {
        contents[j].classList.remove('active');
    }
    var content = document.getElementById('tab-' + tabName);
    if (content) content.classList.add('active');

    // 渲染对应内容
    if (tabName === 'saves') renderSaveSlots();
    else if (tabName === 'game') renderSettingsTab();
    else if (tabName === 'history') renderHistory();
    else if (tabName === 'about') renderAboutTab();
}

/** 获取所有存档槽位数据 */
function getSaveSlots() {
    try {
        var raw = localStorage.getItem(SAVE_SLOTS_KEY);
        if (raw) return JSON.parse(raw);
    } catch (e) { /* 静默 */ }
    return [];
}

/** 保存所有槽位到 localStorage */
function setSaveSlots(slots) {
    try {
        localStorage.setItem(SAVE_SLOTS_KEY, JSON.stringify(slots));
    } catch (e) { /* 静默 */ }
}

/** 构建完整存档对象 */
function buildSaveData() {
    return {
        version: GAME_VERSION,
        gameVersion: GAME_VERSION,
        timestamp: Date.now(),
        gameState: {
            willpower: gameState.willpower,
            stamina: gameState.stamina,
            insight: gameState.insight,
            flags: gameState.flags ? gameState.flags.slice() : [],
            currentNode: gameState.currentNode,
            history: gameState.history ? gameState.history.slice() : [],
            endingsUnlocked: gameState.endingsUnlocked ? gameState.endingsUnlocked.slice() : [],
            achievements: gameState.achievements ? gameState.achievements.slice() : [],
            achievementProgress: gameState.achievementProgress ? JSON.parse(JSON.stringify(gameState.achievementProgress)) : {},
            playCount: gameState.playCount || 0,
            _pendingTransition: null,
            _abandonCount: gameState._abandonCount || 0,
            _lonerConsecutive: gameState._lonerConsecutive || 0,
            _aggressiveCount: gameState._aggressiveCount || 0,
            _restCount: gameState._restCount || 0,
            _lowStaminaCount: gameState._lowStaminaCount || 0,
            _justDidE12: gameState._justDidE12 || false,
            _memeN2BChosen: gameState._memeN2BChosen || false
        },
        settings: {
            memeMode: gameSettings.memeMode,
            autoSave: gameSettings.autoSave,
            soundEnabled: gameSettings.soundEnabled,
            liquidGlassEnabled: gameSettings.liquidGlassEnabled,
            textSpeed: gameSettings.textSpeed
        },
        metadata: {
            playerName: '圣地亚哥',
            totalPlayTime: 0,
            lastPlayDate: new Date().toISOString()
        }
    };
}

/** 渲染所有存档槽位 */
function renderSaveSlots() {
    var container = document.getElementById('tab-saves');
    if (!container) return;
    var slots = getSaveSlots();
    var html = '';

    // 版本信息
    html += '<div class="save-version-info">当前游戏版本: v' + GAME_VERSION + '</div>';

    // 各槽位
    for (var i = 0; i < MAX_SLOTS; i++) {
        var data = (slots && slots[i]) ? slots[i] : null;
        html += createSaveSlotHtml(i, data);
    }

    // 导入导出按钮
    html += '<div class="save-import-export">';
    html += '<button class="slot-btn primary" onclick="importSave()">📥 导入存档</button>';
    html += '<button class="slot-btn" onclick="exportAllSlots()">📤 导出所有存档</button>';
    html += '</div>';

    // 自动存档开关
    html += '<div class="setting-row" style="margin-top:12px;">';
    html += '<div><label>自动存档</label><div class="setting-desc">每次选择后自动保存到自动存档槽位</div></div>';
    html += '<label class="toggle-switch"><input type="checkbox" id="auto-save-toggle" ' + (gameSettings.autoSave ? 'checked' : '') + ' onchange="gameSettings.autoSave=this.checked;saveSettings();"><span class="toggle-slider"></span></label>';
    html += '</div>';

    container.innerHTML = html;

    // 为每个槽位绑定展开/折叠事件
    for (var si = 0; si < MAX_SLOTS; si++) {
        var detailEl = document.getElementById('slot-detail-' + si);
        if (detailEl) {
            (function (idx) {
                var toggleBtn = document.getElementById('slot-toggle-' + idx);
                if (toggleBtn) {
                    toggleBtn.onclick = function () { toggleSlotDetail(idx); };
                }
            })(si);
        }
    }
}

/** 创建单个存档槽位HTML */
function createSaveSlotHtml(slotIndex, data) {
    var html = '<div class="save-slot">';
    var hasData = data && data.gameState;

    // 头部
    html += '<div class="save-slot-header">';
    html += '<span class="save-slot-name"><span class="slot-marker' + (hasData ? '' : ' empty') + '"></span>' + SLOT_NAMES[slotIndex] + '</span>';
    if (hasData && data.timestamp) {
        var d = new Date(data.timestamp);
        html += '<span class="save-slot-time">' + d.toLocaleString() + '</span>';
    }
    html += '</div>';

    if (hasData) {
        var gs = data.gameState;
        html += '<div class="save-slot-stats">';
        html += '🧠 精神 ' + (gs.willpower || 0) + '　💪 体力 ' + (gs.stamina || 0) + '　🌊 感悟 ' + (gs.insight || 0);
        if (gs.endingsUnlocked && gs.endingsUnlocked.length > 0) {
            html += '　🏆 ' + gs.endingsUnlocked.join('/');
        }
        html += '</div>';

        // 版本标记
        if (data.version && data.version !== GAME_VERSION) {
            html += '<div style="font-size:11px;color:#ff8c00;margin-bottom:4px;">⚠ 存档版本: v' + (data.version || '?') + ' (当前: v' + GAME_VERSION + ')</div>';
        }

        html += '<div class="save-slot-actions">';
        html += '<button class="slot-btn primary" onclick="loadFromSlot(' + slotIndex + ')">📖 读取</button>';
        html += '<button class="slot-btn" onclick="saveToSlot(' + slotIndex + ')">💾 覆盖</button>';
        html += '<button class="slot-btn" onclick="exportSlot(' + slotIndex + ')">📤 导出</button>';
        if (slotIndex >= 2) {
            html += '<button class="slot-btn danger" onclick="deleteSlot(' + slotIndex + ')">🗑 删除</button>';
        }
        html += '<button class="slot-btn" id="slot-toggle-' + slotIndex + '">📜 查看路径</button>';
        html += '</div>';

        // 展开详情
        html += '<div class="save-slot-detail" id="slot-detail-' + slotIndex + '">';
        var history = gs.history || [];
        html += '<div class="path-label">路径（共' + history.length + '个节点）：</div>';
        var items = [];
        for (var h = 0; h < history.length; h++) {
            var id = history[h];
            var name = getNodeDisplayName(id);
            var icon = (id.indexOf('E') === 0) ? '🏆' : '📖';
            items.push(icon + ' ' + name);
        }
        html += '<div style="font-size:13px;line-height:1.6;">' + items.join(' → ') + '</div>';
        var last = history[history.length - 1];
        if (last && last.indexOf('E') === 0 && gs.endingsUnlocked) {
            html += '<div class="final-ending">最终结局：' + getNodeDisplayName(last) + '</div>';
        }
        html += '</div>';
    } else {
        html += '<div class="save-slot-empty">（空）</div>';
        html += '<div class="save-slot-actions">';
        html += '<button class="slot-btn primary" onclick="saveToSlot(' + slotIndex + ')">💾 新建存档</button>';
        html += '</div>';
    }

    html += '</div>';
    return html;
}

/** 展开/折叠存档槽位详情 */
function toggleSlotDetail(slotIndex) {
    var detail = document.getElementById('slot-detail-' + slotIndex);
    if (!detail) return;
    if (detail.classList.contains('open')) {
        detail.classList.remove('open');
    } else {
        detail.classList.add('open');
    }
}

/** 保存当前游戏到指定槽位 */
function saveToSlot(slotIndex) {
    var slots = getSaveSlots();
    while (slots.length < MAX_SLOTS) { slots.push(null); }
    var data = buildSaveData();
    slots[slotIndex] = data;
    setSaveSlots(slots);
    gameState.achievementProgress.totalSaves = (gameState.achievementProgress.totalSaves || 0) + 1;
    renderSaveSlots();
    updateSaveIndicator('✅ 已保存到 ' + SLOT_NAMES[slotIndex]);
}

/** 从指定槽位读档 */
function loadFromSlot(slotIndex) {
    var slots = getSaveSlots();
    if (!slots[slotIndex] || !slots[slotIndex].gameState) {
        alert('📭 该槽位无存档数据');
        return;
    }
    var data = slots[slotIndex];
    // 升级旧存档
    data = upgradeSave(data);
    if (!confirm('确定要从「' + SLOT_NAMES[slotIndex] + '」读取存档吗？当前进度将丢失。')) return;
    restoreStateFromSlotData(data);
    sfxLoad();
    gameState.achievementProgress.totalLoads = (gameState.achievementProgress.totalLoads || 0) + 1;
    closeSettings();
    updateSaveIndicator('✅ 已从 ' + SLOT_NAMES[slotIndex] + ' 读档');
    checkAchievements();
}

/** 从槽位数据恢复状态 */
function restoreStateFromSlotData(data) {
    if (!data || !data.gameState) return;
    cancelPendingTransition();
    var gs = data.gameState;
    gameState.willpower = gs.willpower || 1;
    gameState.stamina = gs.stamina || 4;
    gameState.insight = gs.insight || 0;
    gameState.flags = gs.flags || [];
    gameState.currentNode = gs.currentNode || 'N1';
    gameState.history = gs.history || [];
    gameState.endingsUnlocked = gs.endingsUnlocked || [];
    gameState.achievements = gs.achievements || [];
    gameState.achievementProgress = gs.achievementProgress || {
        totalPlaythroughs: 0, totalSaves: 0, totalLoads: 0,
        sharkFightCount: 0, sharkFleeCount: 0,
        nodesSurvivedLowStamina: 0, rejectSurrenderCount: 0
    };
    gameState.playCount = gs.playCount || 0;
    gameState._pendingTransition = null;
    gameState._abandonCount = gs._abandonCount || 0;
    gameState._lonerConsecutive = gs._lonerConsecutive || 0;
    gameState._aggressiveCount = gs._aggressiveCount || 0;
    gameState._restCount = gs._restCount || 0;
    gameState._lowStaminaCount = gs._lowStaminaCount || 0;
    gameState._justDidE12 = gs._justDidE12 || false;
    gameState._memeN2BChosen = gs._memeN2BChosen || false;

    // 恢复设置
    if (data.settings) {
        if (typeof data.settings.memeMode === 'boolean') gameSettings.memeMode = data.settings.memeMode;
        if (typeof data.settings.autoSave === 'boolean') gameSettings.autoSave = data.settings.autoSave;
        if (typeof data.settings.soundEnabled === 'boolean') gameSettings.soundEnabled = data.settings.soundEnabled;
        if (typeof data.settings.liquidGlassEnabled === 'boolean') gameSettings.liquidGlassEnabled = data.settings.liquidGlassEnabled;
        if (typeof data.settings.textSpeed === 'number') gameSettings.textSpeed = data.settings.textSpeed;
        saveSettings();
    }

    renderNode(gameState.currentNode);
    updateUI();
    updateGallery();
    updateAchievementUI();
}

/** 删除指定槽位 */
function deleteSlot(slotIndex) {
    if (slotIndex < 2) {
        alert('自动存档和快速存档不可删除，只能覆盖');
        return;
    }
    if (!confirm('确定要删除「' + SLOT_NAMES[slotIndex] + '」吗？此操作不可恢复。')) return;
    var slots = getSaveSlots();
    if (slots[slotIndex]) {
        slots[slotIndex] = null;
        setSaveSlots(slots);
        renderSaveSlots();
        updateSaveIndicator('🗑 已删除 ' + SLOT_NAMES[slotIndex]);
    }
}

/** 导入存档JSON文件 */
function importSave() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = function (e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (ev) {
            try {
                var data = JSON.parse(ev.target.result);
                // 判断是单个存档还是多槽位导出
                if (data.slots && Array.isArray(data.slots)) {
                    // 多槽位导出
                    if (!confirm('检测到多槽位存档包，导入将覆盖当前所有存档槽位，确定继续吗？')) return;
                    var importedSlots = data.slots;
                    for (var i = 0; i < importedSlots.length && i < MAX_SLOTS; i++) {
                        if (importedSlots[i]) {
                            importedSlots[i] = upgradeSave(importedSlots[i]);
                        }
                    }
                    setSaveSlots(importedSlots);
                    renderSaveSlots();
                    alert('✅ 已导入全部存档槽位');
                } else if (data.gameState) {
                    // 单个存档，放入第一个空槽位
                    data = upgradeSave(data);
                    var slots = getSaveSlots();
                    var targetSlot = -1;
                    for (var s = 2; s < MAX_SLOTS; s++) {
                        if (!slots[s] || !slots[s].gameState) {
                            targetSlot = s;
                            break;
                        }
                    }
                    if (targetSlot === -1) {
                        if (!confirm('所有手动槽位已满，是否覆盖手动1？')) return;
                        targetSlot = 2;
                    }
                    while (slots.length < MAX_SLOTS) { slots.push(null); }
                    slots[targetSlot] = data;
                    setSaveSlots(slots);
                    renderSaveSlots();
                    alert('✅ 已导入存档到「' + SLOT_NAMES[targetSlot] + '」');
                } else {
                    alert('❌ 无效的存档文件格式');
                }
            } catch (err) {
                alert('❌ 文件解析失败：' + (err.message || '未知错误'));
            }
        };
        reader.readAsText(file);
    };
    input.click();
}

/** 升级旧存档格式到当前版本 */
function upgradeSave(data) {
    if (!data) return data;
    if (!data.version) data.version = '1.0.0';
    if (!data.gameVersion) data.gameVersion = GAME_VERSION;
    if (!data.timestamp) data.timestamp = Date.now();
    if (!data.gameState) {
        data.gameState = {
            willpower: 1, stamina: 4, insight: 0,
            flags: [], currentNode: 'N1', history: [],
            endingsUnlocked: [], achievements: [],
            achievementProgress: { totalPlaythroughs: 0, totalSaves: 0, totalLoads: 0, sharkFightCount: 0, sharkFleeCount: 0, nodesSurvivedLowStamina: 0, rejectSurrenderCount: 0 },
            playCount: 0
        };
    }
    var gs = data.gameState;
    if (typeof gs.willpower === 'undefined') gs.willpower = 1;
    if (typeof gs.stamina === 'undefined') gs.stamina = 4;
    if (typeof gs.insight === 'undefined') gs.insight = 0;
    if (!gs.flags) gs.flags = [];
    if (!gs.history) gs.history = [];
    if (!gs.endingsUnlocked) gs.endingsUnlocked = [];
    if (!gs.achievements) gs.achievements = [];
    if (!gs.achievementProgress) {
        gs.achievementProgress = {
            totalPlaythroughs: 0, totalSaves: 0, totalLoads: 0,
            sharkFightCount: 0, sharkFleeCount: 0,
            nodesSurvivedLowStamina: 0, rejectSurrenderCount: 0
        };
    }
    if (typeof gs.playCount === 'undefined') gs.playCount = 0;
    if (typeof gs._abandonCount === 'undefined') gs._abandonCount = 0;
    if (typeof gs._lonerConsecutive === 'undefined') gs._lonerConsecutive = 0;
    if (typeof gs._aggressiveCount === 'undefined') gs._aggressiveCount = 0;
    if (typeof gs._restCount === 'undefined') gs._restCount = 0;
    if (typeof gs._lowStaminaCount === 'undefined') gs._lowStaminaCount = 0;
    if (typeof gs._justDidE12 === 'undefined') gs._justDidE12 = false;
    if (typeof gs._memeN2BChosen === 'undefined') gs._memeN2BChosen = false;
    if (!data.settings) {
        data.settings = { memeMode: true, autoSave: true, soundEnabled: false, liquidGlassEnabled: false, textSpeed: 1.0 };
    }
    if (!data.metadata) {
        data.metadata = { playerName: '圣地亚哥', totalPlayTime: 0, lastPlayDate: new Date().toISOString() };
    }
    return data;
}

/** 获取节点友好名称 */
function getNodeDisplayName(nodeId) {
    if (!nodeId) return '?';
    if (gameData && gameData.nodes) {
        var node = gameData.nodes[nodeId];
        if (node && node.scene) {
            var scene = node.scene || '';
            // 移除emoji前缀
            var name = scene.replace(/^[^\u4e00-\u9fa5a-zA-Z]+/, '');
            return name || nodeId;
        }
    }
    if (gameData && gameData.endings) {
        var ending = gameData.endings[nodeId];
        if (ending) return '🏆 ' + ending.title;
    }
    return nodeId;
}

/** 渲染历史记录标签页 */
function renderHistory() {
    var container = document.getElementById('tab-history');
    if (!container) return;
    var history = gameState.history || [];
    var totalNodes = 0;
    if (gameData && gameData.nodes) {
        for (var k in gameData.nodes) {
            if (gameData.nodes.hasOwnProperty(k)) totalNodes++;
        }
    }
    var pct = totalNodes > 0 ? Math.round(history.length / totalNodes * 100) : 0;

    var html = '<div class="history-timeline">';
    html += '<div class="history-summary">当前游戏路径（共 <strong>' + history.length + '</strong> 个节点，完成度 <strong>' + pct + '%</strong>）</div>';

    if (history.length === 0) {
        html += '<div style="color:#6a8f9a;text-align:center;padding:20px;">暂无历史记录，开始游戏吧！</div>';
    } else {
        html += '<div style="font-size:13px;color:#6a8f9a;margin-bottom:8px;">⏳ 节点序列（按时间顺序）：</div>';
        for (var i = 0; i < history.length; i++) {
            var id = history[i];
            var name = getNodeDisplayName(id);
            var icon = (id.indexOf('E') === 0) ? '🏆' : '📖';
            var isCurrent = (i === history.length - 1);
            html += '<div class="history-item' + (isCurrent ? ' current' : '') + '">';
            html += '<span class="history-icon">' + icon + '</span>';
            html += '<span>' + (i + 1) + '. ' + name + ' <span style="font-size:11px;color:#6a8f9a;">(' + id + ')</span>';
            if (isCurrent) html += ' <span style="font-size:11px;color:#c9a86c;">← 当前位置</span>';
            html += '</span></div>';
        }
    }

    html += '<div class="history-actions">';
    html += '<button class="slot-btn" onclick="exportHistoryAsText()">📤 导出历史为文本</button>';
    html += '</div>';
    html += '</div>';

    container.innerHTML = html;
}

/** 导出历史记录为文本文件 */
function exportHistoryAsText() {
    var history = gameState.history || [];
    var lines = ['《老人与海》游戏路径记录', '生成时间：' + new Date().toLocaleString(), '游戏版本：v' + GAME_VERSION, ''];
    for (var i = 0; i < history.length; i++) {
        var id = history[i];
        var name = getNodeDisplayName(id);
        lines.push((i + 1) + '. ' + name + ' (' + id + ')');
    }
    if (history.length === 0) {
        lines.push('（暂无历史记录）');
    }
    var text = lines.join('\n');
    var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'history_' + new Date().toISOString().slice(0, 10) + '.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

/** 更新存档指示器 */
function updateSaveIndicator(msg) {
    var indicator = document.getElementById('save-indicator');
    if (!indicator) return;
    var orig = indicator.textContent;
    indicator.textContent = msg || '✅ 已保存';
    indicator.style.color = '#7ec8a0';
    setTimeout(function () {
        indicator.textContent = orig;
        indicator.style.color = '';
    }, 2000);
}
